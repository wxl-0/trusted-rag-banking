services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trusted_rag}
      POSTGRES_USER: ${POSTGRES_USER:-trusted_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: trusted_rag_test
      POSTGRES_USER: trusted_rag_test
      POSTGRES_PASSWORD: trusted_rag_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-trusted_rag}
      PGUSER: ${POSTGRES_USER:-trusted_rag}
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    command: >-
      sh -c 'psql -v ON_ERROR_STOP=1
      -c "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION CURRENT_USER"'
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trusted_rag}
      KC_DB_USERNAME: ${POSTGRES_USER:-trusted_rag}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:v1.9.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-trusted_rag}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-trusted_rag}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8080/realms/trusted-rag}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-trusted-rag-api}
      - KEYCLOAK_DISCOVERY_URL=http://keycloak:8080/realms/trusted-rag/.well-known/openid-configuration
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/trusted-rag/protocol/openid-connect/certs
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-knowledge-documents}
      - KNOWLEDGE_UPLOAD_MAX_BYTES=${KNOWLEDGE_UPLOAD_MAX_BYTES:-52428800}
      - QDRANT_HOST=qdrant
      - HF_HOME=/models
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_HOME:-./models}:/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["./entrypoint.worker.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-trusted_rag}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-trusted_rag}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-knowledge-documents}
      - QDRANT_HOST=qdrant
      - HF_HOME=/models
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_HOME:-./models}:/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_KEYCLOAK_AUTHORITY: ${VITE_KEYCLOAK_AUTHORITY:-http://localhost:8080/realms/trusted-rag}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-trusted-rag-web}
    ports:
      - "80:80"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
