services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trusted_rag}
      POSTGRES_USER: ${POSTGRES_USER:-trusted_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: trusted_rag_test
      POSTGRES_USER: trusted_rag_test
      POSTGRES_PASSWORD: trusted_rag_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CHANGE_ME}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-trusted_rag}
      PGUSER: ${POSTGRES_USER:-trusted_rag}
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    command: >-
      sh -c 'psql -v ON_ERROR_STOP=1
      -c "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION CURRENT_USER"'
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trusted_rag}
      KC_DB_USERNAME: ${POSTGRES_USER:-trusted_rag}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.9.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-trusted_rag}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-trusted_rag}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8080/realms/trusted-rag}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-trusted-rag-api}
      - KEYCLOAK_DISCOVERY_URL=http://keycloak:8080/realms/trusted-rag/.well-known/openid-configuration
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/trusted-rag/protocol/openid-connect/certs
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-CHANGE_ME}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-CHANGE_ME}
      - MINIO_BUCKET=${MINIO_BUCKET:-knowledge-documents}
      - KNOWLEDGE_UPLOAD_MAX_BYTES=${KNOWLEDGE_UPLOAD_MAX_BYTES:-52428800}
      - INGESTION_WORKER_HEARTBEAT_TTL_SECONDS=${INGESTION_WORKER_HEARTBEAT_TTL_SECONDS:-15}
      - QDRANT_HOST=qdrant
      - QDRANT_INDEXING_THRESHOLD_KB=${QDRANT_INDEXING_THRESHOLD_KB:-5000}
      - QDRANT_DEFAULT_SEGMENT_NUMBER=${QDRANT_DEFAULT_SEGMENT_NUMBER:-2}
      - RETRIEVAL_MAX_WORKERS=${RETRIEVAL_MAX_WORKERS:-2}
      - HF_HOME=/models
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_HOME:-./models}:/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 30s

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["./entrypoint.worker.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-trusted_rag}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-trusted_rag}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-CHANGE_ME}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-CHANGE_ME}
      - MINIO_BUCKET=${MINIO_BUCKET:-knowledge-documents}
      - INGESTION_TASK_LEASE_SECONDS=${INGESTION_TASK_LEASE_SECONDS:-900}
      - INGESTION_WORKER_HEARTBEAT_TTL_SECONDS=${INGESTION_WORKER_HEARTBEAT_TTL_SECONDS:-15}
      - QDRANT_HOST=qdrant
      - QDRANT_INDEXING_THRESHOLD_KB=${QDRANT_INDEXING_THRESHOLD_KB:-5000}
      - QDRANT_DEFAULT_SEGMENT_NUMBER=${QDRANT_DEFAULT_SEGMENT_NUMBER:-2}
      - HF_HOME=/models
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_HOME:-./models}:/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          from src.document_uploads import get_ingestion_queue;
          assert get_ingestion_queue().worker_alive()
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_KEYCLOAK_AUTHORITY: ${VITE_KEYCLOAK_AUTHORITY:-http://localhost:8080/realms/trusted-rag}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-trusted-rag-web}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
