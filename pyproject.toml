[project]
name = "trusted-rag-banking"
version = "0.1.0"
description = "面向银行业监管制度与统计报表的可信 RAG 问答系统"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "httpx==0.27.0",
    "openai==1.35.3",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.0",
    "pymupdf==1.24.5",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "pywin32==312; sys_platform == 'win32'",
    "qdrant-client==1.9.1",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.0.1",
    "uvicorn==0.30.1",
    "xlrd==2.0.1",
    "xlwt==1.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
]

[tool.uv]
package = false
